<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>TMH-谁是队友扑克游戏</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="app">
    <!-- 顶栏 -->
    <div class="topbar">
      <div class="title"><span class="mini">♦️</span>TMH · 谁是队友</div>
      <div class="tb-meta" id="metaInfo">第 1 局</div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btnCounter" title="记牌器">🔢</button>
      <button class="icon-btn" id="btnRule" title="规则">📖</button>
      <button class="icon-btn" id="btnMenu" title="菜单">☰</button>
    </div>

    <!-- 牌桌 -->
    <div class="table" id="table">
      <div class="center-info">
        <div class="tip" id="centerTip"></div>
      </div>

      <div class="seat seat-top" id="seat2"></div>
      <div class="seat seat-left" id="seat3"></div>
      <div class="seat seat-right" id="seat1"></div>
    </div>

    <!-- 底部：我 -->
    <div class="bottom">
      <div class="mybar" id="mybar"></div>
      <div class="hand-wrap" id="handWrap">
        <div class="hand" id="hand"></div>
      </div>
      <div class="actions" id="actions"></div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="config.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/combos.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/engine_ai.js"></script>
  <script src="js/net.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
